# fastbuild_6.12.38_resukisu_layout_fix.yml
# ReSukiSU layout detector
# 不再假设 supercalls.c 固定路径

- name: Detect ReSukiSU real layout
  shell: bash
  run: |
    set -e
    echo "===== Detect ReSukiSU files ====="

    KSU_DIR="$(find kernel_workspace -maxdepth 5 -type d -name KernelSU 2>/dev/null | head -n 1 || true)"

    if [ -z "$KSU_DIR" ]; then
      echo "[ERROR] KernelSU directory not found"
      exit 1
    fi

    echo "[INFO] KernelSU root:"
    echo "$KSU_DIR"

    echo "[INFO] Search ReSukiSU related files:"
    find "$KSU_DIR" -type f \
      \( -iname "*ksu*" -o -iname "*reksu*" -o -iname "*hook*" -o -iname "*super*" -o -iname "*call*" \) \
      -print || true

    if find "$KSU_DIR" -type f | grep -Eq "supercalls.c|hook.c|ksu.c"; then
      echo "[INFO] ReSukiSU entry candidate detected"
    else
      echo "[WARN] No common entry name detected, keep layout output"
    fi
