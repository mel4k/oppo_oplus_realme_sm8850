# fastbuild_6.12.38.yml
# 仅修正 ReSukiSU + SUSFS-X / ZeroMount-X 70补丁定位
# 50/51/60 顺序保持不变
# 70 前增加真实 supercalls.c 探测，避免写死路径

# 将下面代码替换原 workflow 中 70 补丁应用前的路径检测部分：

- name: Detect ReSukiSU supercalls layout
  shell: bash
  run: |
    echo "===== 查找 ReSukiSU supercalls.c ====="

    SUPER_CALLS="$(find "$COMMON_DIR" \
      -type f \
      -name "supercalls.c" \
      -print -quit 2>/dev/null || true)"

    if [ -z "$SUPER_CALLS" ]; then
      echo "[ERROR] 未找到 ReSukiSU supercalls.c"
      find "$COMMON_DIR" -type f -name "supercalls.c" -print || true
      exit 1
    fi

    echo "[INFO] 找到:"
    echo "$SUPER_CALLS"

    echo "[INFO] kernelsu链接:"
    readlink -f "$COMMON_DIR/drivers/kernelsu" || true

    echo "$SUPER_CALLS" > "$GITHUB_WORKSPACE/supercalls_path.txt"

- name: Apply 70 SUSFS-X ReSukiSU patch
  shell: bash
  run: |
    P70="$(find_patch '70_ksu_safety-resukisu-6.12-SUSFS-X*.patch')"

    SUPER_CALLS="$(cat "$GITHUB_WORKSPACE/supercalls_path.txt")"

    echo "[INFO] Apply 70 patch target:"
    echo "$SUPER_CALLS"

    # 根据真实文件位置自动计算patch目录
    PATCH_DIR="$(dirname "$SUPER_CALLS")"

    cd "$PATCH_DIR"

    patch -p1 < "$P70"
